name: Test and build APK

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android scaffold if missing
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --org com.goldsignal --project-name gold_signal_assistant .
          fi
          python3 tool/patch_android.py
          rm -f test/widget_test.dart

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: gold-signal-assistant-apk
          path: build/app/outputs/flutter-apk/app-release.apk
